# YYC³ Grafana 仪表盘自动配置
apiVersion: 1

providers:
  - name: YYC3-Dashboards
    orgId: 1
    folder: YYC³
    folderUid: yyc3
    type: file
    disableDeletion: false
    updateIntervalSeconds: 60
    allowUiUpdates: true
    options:
      path: /etc/grafana/dashboards
      foldersFromFilesStructure: false
