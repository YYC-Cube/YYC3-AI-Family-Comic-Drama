# YYC³ Grafana 数据源自动配置（2026-09-26：补 Loki——审计流 shipper 消费端依赖，compose.full 已含 Loki 2.9.2）
apiVersion: 1

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://loki:3100
    isDefault: false
    editable: false
