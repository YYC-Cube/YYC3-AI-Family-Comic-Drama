# YYC³ Grafana 告警规则（A2A 审计闭环：死信 / 孤儿 / 回收停滞）
# 2026-09-26：基于 a2a_metrics 暴露的 Prometheus 指标；通知联系人在 Grafana UI 绑定（contact point 随部署环境而异，不入仓）
apiVersion: 1

groups:
  - orgId: 1
    name: a2a-audit-alerts
    folder: A2A 可观测
    interval: 60s
    rules:
      - uid: a2a-dlq-enqueued
        title: A2A 死信入队（5 分钟窗口 > 0）
        condition: C
        for: 0s
        noDataState: OK
        execErrState: Error
        labels:
          severity: critical
        annotations:
          summary: "A2A 死信队列新增 {{ $values.A }} 条（5m）"
          description: "stream:agent:dlq 有消息落入，Worker 连续失败已达 MAX_RETRY，请排查对应 Agent 任务"
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              expr: sum(increase(a2a_dlq_enqueued_total[5m]))
              instant: true
          - refId: C
            datasourceUid: "-100"
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
                  operator:
                    type: and
                  query:
                    params: [C]
                  reducer:
                    type: last
                  type: query
      - uid: a2a-result-orphan
        title: A2A 孤儿回执（5 分钟窗口 > 0）
        condition: C
        for: 0s
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
        annotations:
          summary: "A2A 孤儿回执 {{ $values.A }} 条（5m）"
          description: "结果流回执无匹配聚合器（trace 超时已回收或未知 trace），审计流已记录，可在 Loki（job=a2a-audit, event=orphan_result）检索明细"
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              expr: sum(increase(a2a_result_orphan_total[5m]))
              instant: true
          - refId: C
            datasourceUid: "-100"
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
                  operator:
                    type: and
                  query:
                    params: [C]
                  reducer:
                    type: last
                  type: query
      - uid: a2a-reclaim-stalled
        title: A2A 回收停滞（30 分钟窗口 = 0 且网关存活）
        condition: C
        for: 300s
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
        annotations:
          summary: "A2A 挂起回收 30m 无动作"
          description: "XAUTOCLAIM 回收计数 30 分钟为 0——无宕机回执属正常；若伴随任务超时增多，请检查回收循环健康度"
        data:
          - refId: A
            relativeTimeRange:
              from: 1800
              to: 0
            datasourceUid: prometheus
            model:
              expr: sum(increase(a2a_result_reclaimed_total[30m]))
              instant: true
          - refId: C
            datasourceUid: "-100"
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: lt
                    params: [1]
                  operator:
                    type: and
                  query:
                    params: [C]
                  reducer:
                    type: last
                  type: query
