<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>YYC³ Cube Hub · 仓库矩阵操作中心</title>
    <meta
      name="description"
      content="YYC³ Cube Hub — YYC-Cube / YanYuCloudCube 双组织 94 个仓库的统一矩阵操作中心：分类浏览、智能检索、上线部署指南、进度追踪与数据导入导出。"
    />
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0%25' y1='0%25' x2='100%25' y2='100%25'%3E%3Cstop offset='0%25' stop-color='%238b5cf6'/%3E%3Cstop offset='100%25' stop-color='%2306b6d4'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='6' fill='url(%23g)'/%3E%3Ctext x='16' y='23' text-anchor='middle' font-size='17' font-weight='700' font-family='sans-serif' fill='%23fff'%3EY3%3C/text%3E%3C/svg%3E"
    />
    <script>
      /* 防主题闪烁（FOUC）：渲染前恢复已保存主题 */
      if (localStorage.getItem('yc3hub-theme') === 'light') {
        document.documentElement.classList.add('light');
      }
    </script>
    <style>
      /* ═══ CSS 变量与主题 — 设计指导文档 §2 ═══ */
      :root {
        --bg: #0a0a0f;
        --bg2: #12121a;
        --bg3: #1a1a2e;
        --surface: rgba(255, 255, 255, 0.03);
        --surface-hover: rgba(255, 255, 255, 0.06);
        --border: rgba(255, 255, 255, 0.08);
        --border-hover: rgba(255, 255, 255, 0.15);
        --text: #f1f1f6;
        --text2: rgba(255, 255, 255, 0.65);
        --text3: rgba(255, 255, 255, 0.35);
        --accent-v: #8b5cf6;
        --accent-c: #06b6d4;
        --accent-e: #22c55e;
        --accent-r: #ef4444;
        --accent-o: #f59e0b;
        --accent-p: #ec4899;
        --radius: 14px;
        --radius-sm: 8px;
        --shadow: 0 4px 24px rgba(0, 0, 0, 0.3);
        --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
        --font-mono: 'SF Mono', 'Fira Code', 'Cascadia Code', 'JetBrains Mono', 'Consolas', monospace;
      }
      .light {
        --bg: #f5f5f0;
        --bg2: #e8e8e3;
        --bg3: #ddd;
        --surface: rgba(0, 0, 0, 0.02);
        --surface-hover: rgba(0, 0, 0, 0.05);
        --border: rgba(0, 0, 0, 0.08);
        --border-hover: rgba(0, 0, 0, 0.15);
        --text: #1a1a2e;
        --text2: rgba(0, 0, 0, 0.55);
        --text3: rgba(0, 0, 0, 0.3);
        --shadow: 0 4px 24px rgba(0, 0, 0, 0.08);
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }
      body {
        font-family: var(--font);
        background: var(--bg);
        color: var(--text);
        overflow-x: hidden;
      }
      ::selection {
        background: rgba(139, 92, 246, 0.3);
        color: #fff;
      }
      html {
        scroll-behavior: smooth;
      }
      :focus-visible {
        outline: 2px solid var(--accent-c);
        outline-offset: 2px;
      }
      .sb-nav::-webkit-scrollbar,
      .modal-body::-webkit-scrollbar,
      .code-block pre::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      .sb-nav::-webkit-scrollbar-thumb,
      .modal-body::-webkit-scrollbar-thumb,
      .code-block pre::-webkit-scrollbar-thumb {
        background: var(--border-hover);
        border-radius: 3px;
      }
      .sb-nav {
        scrollbar-width: thin;
        scrollbar-color: var(--border-hover) transparent;
      }

      /* ═══ 布局 — §3 三段式 ═══ */
      .app {
        display: flex;
        min-height: 100vh;
      }

      /* ═══ Sidebar 280px 固定 ═══ */
      .sidebar {
        width: 280px;
        flex-shrink: 0;
        background: var(--bg2);
        border-right: 1px solid var(--border);
        display: flex;
        flex-direction: column;
        position: fixed;
        top: 0;
        left: 0;
        bottom: 0;
        z-index: 100;
        transition: transform 0.3s ease;
      }
      .sidebar.hidden {
        transform: translateX(-100%);
      }
      .sb-header {
        padding: 20px 20px 16px;
        border-bottom: 1px solid var(--border);
      }
      .sb-logo {
        display: flex;
        align-items: center;
        gap: 10px;
        text-decoration: none;
      }
      .sb-logo-icon {
        width: 32px;
        height: 32px;
        border-radius: 8px;
        background: linear-gradient(135deg, var(--accent-v), var(--accent-c));
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 13px;
        font-weight: 700;
        font-family: var(--font-mono);
        color: #fff;
      }
      .sb-logo-text {
        font-size: 15px;
        font-weight: 700;
        color: var(--text);
      }
      .sb-logo-sub {
        font-size: 10px;
        color: var(--text3);
        letter-spacing: 1px;
      }
      .sb-search {
        margin: 12px 16px;
        padding: 8px 12px;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius-sm);
        display: flex;
        align-items: center;
        gap: 8px;
        transition: 0.2s;
      }
      .sb-search:focus-within {
        border-color: var(--accent-v);
      }
      .sb-search input {
        flex: 1;
        background: none;
        border: none;
        outline: none;
        color: var(--text);
        font-size: 13px;
      }
      .sb-search input::placeholder {
        color: var(--text3);
      }
      .sb-search svg {
        width: 14px;
        height: 14px;
        color: var(--text3);
        flex-shrink: 0;
      }

      /* ═══ Sidebar 进度 ═══ */
      .sb-progress {
        margin: 0 16px 12px;
        padding: 10px 12px;
        border-radius: var(--radius-sm);
        background: var(--surface);
        border: 1px solid var(--border);
      }
      .sb-progress-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 6px;
      }
      .sb-progress-label {
        font-size: 10px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.8px;
        color: var(--text3);
      }
      .sb-progress-pct {
        font-size: 11px;
        font-weight: 700;
        color: var(--accent-v);
      }
      .sb-progress-bar {
        height: 4px;
        border-radius: 2px;
        background: var(--border);
        overflow: hidden;
        margin-bottom: 4px;
      }
      .sb-progress-fill {
        height: 100%;
        border-radius: 2px;
        background: linear-gradient(90deg, var(--accent-v), var(--accent-c));
        transition: width 0.6s ease;
      }
      .sb-progress-count {
        font-size: 10px;
        color: var(--text3);
      }
      .sb-nav {
        flex: 1;
        overflow-y: auto;
        padding: 8px 12px 80px;
      }
      .sb-group {
        margin-bottom: 16px;
      }
      .sb-group-title {
        font-size: 10px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 1.2px;
        color: var(--text3);
        padding: 0 8px;
        margin-bottom: 4px;
      }
      .sb-item {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 6px 8px;
        border-radius: 6px;
        color: var(--text2);
        font-size: 12px;
        cursor: pointer;
        transition: 0.15s;
        text-decoration: none;
        position: relative;
      }
      .sb-item:hover {
        background: var(--surface-hover);
        color: var(--text);
      }
      .sb-item.active {
        background: rgba(139, 92, 246, 0.12);
        color: var(--accent-v);
      }
      .sb-item .sb-dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        flex-shrink: 0;
        background: var(--text3);
        transition: 0.3s;
      }
      .sb-item .sb-dot.done {
        background: var(--accent-e);
        box-shadow: 0 0 6px rgba(34, 197, 94, 0.4);
      }
      .sb-item .sb-dot.ext {
        background: rgba(99, 102, 241, 0.5);
        border: 1px solid rgba(99, 102, 241, 0.3);
      }
      .sb-item .sb-label {
        flex: 1;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .sb-item .sb-order {
        font-size: 9px;
        color: var(--text3);
        font-weight: 600;
        width: 16px;
        text-align: right;
        flex-shrink: 0;
      }

      /* ═══ Main ═══ */
      .main {
        flex: 1;
        margin-left: 280px;
        min-height: 100vh;
        transition: margin-left 0.3s ease;
      }
      .main.expanded {
        margin-left: 0;
      }

      /* ═══ Topbar sticky + blur ═══ */
      .topbar {
        position: sticky;
        top: 0;
        z-index: 50;
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 12px 24px;
        background: rgba(10, 10, 15, 0.8);
        border-bottom: 1px solid var(--border);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
      }
      .light .topbar {
        background: rgba(245, 245, 240, 0.8);
      }
      .topbar-title {
        min-width: 0;
      }
      .topbar-title .tt-main {
        font-size: 16px;
        font-weight: 600;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .topbar-title .tt-sub {
        font-size: 12px;
        color: var(--text3);
        white-space: nowrap;
      }
      .topbar-spacer {
        flex: 1;
      }
      .topbar-search {
        display: none;
        flex: 1;
        max-width: 320px;
        position: relative;
      }
      .main.expanded .topbar-search {
        display: block;
      }
      .topbar-search input {
        width: 100%;
        padding: 6px 12px 6px 32px;
        border-radius: 8px;
        border: 1px solid var(--border);
        background: var(--bg2);
        color: var(--text);
        font-size: 13px;
        outline: none;
        transition: 0.2s;
        font-family: inherit;
      }
      .topbar-search input:focus {
        border-color: var(--accent-v);
      }
      .topbar-search input::placeholder {
        color: var(--text3);
      }
      .topbar-search .ts-icon {
        position: absolute;
        left: 10px;
        top: 50%;
        transform: translateY(-50%);
        color: var(--text3);
        font-size: 13px;
        pointer-events: none;
      }
      .topbar-time {
        display: none;
        align-items: center;
        gap: 5px;
        font-size: 12px;
        color: var(--text2);
        font-family: var(--font-mono);
        padding: 4px 10px;
        border-radius: 6px;
        background: var(--surface);
        border: 1px solid var(--border);
        user-select: none;
        white-space: nowrap;
      }
      .main.expanded .topbar-time {
        display: flex;
      }
      .topbar-time .tt-dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--accent-e);
        animation: pulse-dot 2s ease infinite;
      }
      @keyframes pulse-dot {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.3;
        }
      }
      .btn-menu,
      .btn-theme,
      .btn-share {
        width: 34px;
        height: 34px;
        border-radius: 8px;
        border: 1px solid var(--border);
        background: var(--surface);
        color: var(--text2);
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: 0.2s;
        flex-shrink: 0;
      }
      .btn-menu:hover,
      .btn-theme:hover,
      .btn-share:hover {
        background: var(--surface-hover);
        color: var(--accent-v);
        border-color: rgba(139, 92, 246, 0.3);
      }
      .btn-menu svg,
      .btn-theme svg,
      .btn-share svg {
        width: 16px;
        height: 16px;
      }
      .topbar-actions {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .progress-actions {
        display: flex;
        align-items: center;
        gap: 4px;
      }
      .btn-action {
        width: 30px;
        height: 30px;
        border-radius: 6px;
        border: 1px solid var(--border);
        background: var(--surface);
        color: var(--text2);
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: 0.2s;
      }
      .btn-action:hover {
        background: var(--surface-hover);
        color: var(--text);
      }
      .btn-action.btn-danger:hover {
        background: rgba(239, 68, 68, 0.12);
        color: #ef4444;
        border-color: rgba(239, 68, 68, 0.3);
      }
      .btn-action svg {
        width: 16px;
        height: 16px;
      }

      /* ═══ Dashboard ═══ */
      .dashboard {
        padding: 24px;
        max-width: 1400px;
        margin: 0 auto;
      }
      .dash-header {
        margin-bottom: 32px;
      }
      .dash-badge {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 4px 12px;
        border-radius: 20px;
        background: rgba(139, 92, 246, 0.12);
        color: var(--accent-v);
        font-size: 11px;
        font-weight: 600;
        margin-bottom: 8px;
        animation: heroPulse 8s ease-in-out infinite;
      }
      .dash-badge svg {
        width: 14px;
        height: 14px;
      }
      .dash-title {
        font-size: 28px;
        font-weight: 700;
        margin-bottom: 6px;
        line-height: 1.2;
      }
      .dash-desc {
        font-size: 14px;
        color: var(--text2);
        max-width: 640px;
        line-height: 1.5;
      }
      .dash-stats {
        display: flex;
        gap: 12px;
        margin-top: 20px;
        flex-wrap: wrap;
      }
      .stat-card {
        padding: 12px 18px;
        border-radius: var(--radius-sm);
        background: var(--surface);
        border: 1px solid var(--border);
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .stat-icon {
        font-size: 18px;
      }
      .stat-num {
        font-size: 20px;
        font-weight: 700;
        font-family: var(--font-mono);
      }
      .stat-label {
        font-size: 11px;
        color: var(--text2);
      }

      /* ═══ Filter bar ═══ */
      .filter-bar {
        display: flex;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
        margin-bottom: 24px;
      }
      .filter-btn {
        padding: 6px 14px;
        border-radius: 20px;
        border: 1px solid var(--border);
        background: transparent;
        color: var(--text2);
        font-size: 12px;
        cursor: pointer;
        transition: 0.2s;
        font-weight: 500;
      }
      .filter-btn:hover {
        border-color: var(--border-hover);
        color: var(--text);
      }
      .filter-btn.active {
        background: var(--accent-v);
        color: #fff;
        border-color: var(--accent-v);
      }
      .filter-btn[data-cat='all'].active {
        background: var(--text);
        color: var(--bg);
        border-color: var(--text);
      }
      .filter-btn[data-cat='org-yyc-cube'].active {
        background: var(--accent-v);
        border-color: var(--accent-v);
      }
      .filter-btn[data-cat='org-yanyucloudcube'].active {
        background: var(--accent-c);
        border-color: var(--accent-c);
      }

      /* ═══ 分类区块与卡片 ═══ */
      .cat-section {
        margin-bottom: 36px;
      }
      .cat-header {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 14px;
      }
      .cat-icon {
        font-size: 20px;
      }
      .cat-name {
        font-size: 16px;
        font-weight: 600;
      }
      .cat-count {
        font-size: 12px;
        color: var(--text3);
      }
      .cat-line {
        flex: 1;
        height: 1px;
        background: var(--border);
      }
      .card-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
        gap: 14px;
      }
      .guide-card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 18px;
        cursor: pointer;
        transition: all 0.25s ease;
        position: relative;
        overflow: hidden;
        animation: fadeUp 0.4s ease both;
      }
      .guide-card:hover {
        transform: translateY(-2px);
        border-color: var(--border-hover);
        box-shadow: var(--shadow);
      }
      .guide-card.hidden {
        display: none;
      }
      .gc-bar {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 3px;
        opacity: 0.9;
      }
      .gc-head {
        display: flex;
        align-items: flex-start;
        gap: 12px;
        margin-bottom: 10px;
      }
      .gc-icon {
        width: 38px;
        height: 38px;
        border-radius: 10px;
        flex-shrink: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 18px;
      }
      .gc-info {
        flex: 1;
        min-width: 0;
      }
      .gc-title {
        font-size: 14px;
        font-weight: 600;
        margin-bottom: 2px;
        line-height: 1.3;
      }
      .gc-title-en {
        font-size: 11px;
        color: var(--text3);
        font-family: var(--font-mono);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .gc-meta {
        display: flex;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
        margin-top: 4px;
      }
      .gc-tag {
        font-size: 10px;
        padding: 1px 7px;
        border-radius: 4px;
        font-weight: 600;
      }
      .gc-tag.easy {
        background: rgba(34, 197, 94, 0.12);
        color: #22c55e;
      }
      .gc-tag.medium {
        background: rgba(245, 158, 11, 0.12);
        color: #f59e0b;
      }
      .gc-tag.hard {
        background: rgba(239, 68, 68, 0.12);
        color: #ef4444;
      }
      .gc-time {
        font-size: 10px;
        color: var(--text3);
      }
      .gc-desc {
        font-size: 12px;
        color: var(--text2);
        line-height: 1.5;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }
      .gc-tags {
        display: flex;
        gap: 4px;
        flex-wrap: wrap;
        margin-top: 8px;
      }
      .gc-tags span {
        font-size: 9px;
        padding: 2px 6px;
        border-radius: 4px;
        background: var(--surface);
        color: var(--text3);
        border: 1px solid var(--border);
      }
      .gc-check {
        position: absolute;
        top: 14px;
        right: 14px;
        width: 18px;
        height: 18px;
        border-radius: 50%;
        border: 2px solid var(--border);
        cursor: pointer;
        transition: 0.2s;
        display: flex;
        align-items: center;
        justify-content: center;
        background: transparent;
      }
      .gc-check:hover {
        border-color: var(--accent-e);
      }
      .gc-check.done {
        background: var(--accent-e);
        border-color: var(--accent-e);
      }
      .gc-check.done::after {
        content: '✓';
        color: #fff;
        font-size: 11px;
        font-weight: 700;
      }
      /* ═══ Guide Detail — §4.2 步骤详情 ═══ */
      .guide-detail {
        display: none;
        padding: 24px;
        max-width: 900px;
        margin: 0 auto;
      }
      .guide-detail.active {
        display: block;
      }
      .gd-back {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        color: var(--text2);
        font-size: 13px;
        cursor: pointer;
        margin-bottom: 16px;
        transition: 0.2s;
        background: none;
        border: none;
        font-family: inherit;
      }
      .gd-back:hover {
        color: var(--accent-c);
      }
      .gd-hero {
        background: linear-gradient(135deg, var(--bg3), var(--bg2));
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 24px;
        margin-bottom: 16px;
      }
      .gd-hero-top {
        display: flex;
        align-items: flex-start;
        gap: 14px;
        margin-bottom: 12px;
      }
      .gd-hero-icon {
        width: 52px;
        height: 52px;
        border-radius: 12px;
        font-size: 26px;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
      }
      .gd-hero-title {
        font-size: 22px;
        font-weight: 700;
        line-height: 1.2;
      }
      .gd-hero-titleEn {
        font-size: 12px;
        color: var(--text3);
        font-family: var(--font-mono);
        margin-top: 2px;
      }
      .gd-hero-desc {
        font-size: 13px;
        line-height: 1.6;
        color: var(--text2);
        margin-top: 6px;
      }
      .gd-hero-meta {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;

      /* ═══ 智能搜索 — §5.2 全/半角归一化 + 顺序匹配 ═══ */
      function smartMatch(text, query) {
        if (!query) return true;
        var norm = function (s) {
          return s
            .replace(/[\uff01-\uff5e]/g, function (c) {
              return String.fromCharCode(c.charCodeAt(0) - 0xfee0);
            })
            .replace(/\u3000/g, ' ')
            .toLowerCase();
        };
        var tn = norm(String(text));
        var qn = norm(query);
        var pos = 0;
        for (var i = 0; i < qn.length; i++) {
          var ch = qn[i];
          var idx = tn.indexOf(ch, pos);
          if (idx === -1) {
            if (tn.indexOf(ch) === -1) return false;
            continue;
          }
          pos = idx + 1;
        }
        return true;
      }

        if (!q) return true;
        var hay = [g.title, g.titleEn, g.desc, g.repo, (CATEGORY_META[g.cat] || {}).label || ''].join(' ');
        return smartMatch(hay, q);
      }

          { icon: '🌐', num: ORG_COUNT, label: '组织数' },
          { icon: '🗂️', num: GUIDES.length, label: '收录指南' },
          { icon: '✅', num: done, label: '已完成' },
        ];
        document.getElementById('dashStats').innerHTML = stats
          .map(function (s) {
            return (
              '<div class="stat-card"><span class="stat-icon">' +
              s.icon +
              '</span><div><div class="stat-num">' +
              s.num +
              '</div><div class="stat-label">' +
              s.label +
              '</div></div></div>'
            );
          })
          .join('');
      }

      /* ═══ 筛选按钮 ═══ */
      function renderFilterBar() {
        var bar = document.getElementById('filterBar');
        var btns = [{ key: 'all', icon: '🗂️', label: '全部' }].concat(
          Object.keys(CATEGORY_META).map(function (k) {
            return { key: k, icon: CATEGORY_META[k].icon, label: CATEGORY_META[k].label };
          })
        );
        bar.innerHTML = btns
          .map(function (b) {
            return (
              '<button class="filter-btn' +
              (currentFilter === b.key ? ' active' : '') +
              '" data-cat="' +
              b.key +
              '" onclick="filterByCategory(\'' +
              b.key +
              '\', this)">' +
              b.icon +
              ' ' +
              b.label +
              '</button>'
            );
          })
          .join('');
      }
      function filterByCategory(cat, btn) {
        currentFilter = cat;
        document.querySelectorAll('.filter-btn').forEach(function (b) {
          b.classList.remove('active');
        });
        if (btn) btn.classList.add('active');
        applyFilters(searchQuery);
      }

      /* ═══ 仪表盘渲染（分类分区 + 卡片网格） ═══ */
      function renderDashboard() {
        var groups = {};
        GUIDES.forEach(function (g) {
          (groups[g.cat] = groups[g.cat] || []).push(g);
        });
        var html = '';
        Object.keys(CATEGORY_META).forEach(function (cat) {
          var list = (groups[cat] || []).sort(function (a, b) {
            return a.order - b.order;
          });
          if (!list.length) return;
          var meta = CATEGORY_META[cat];
          html +=
            '<div class="cat-section" data-cat="' +
            cat +
            '"><div class="cat-header"><span class="cat-icon">' +
            meta.icon +
            '</span><span class="cat-name">' +
            meta.label +
            '</span><span class="cat-count">' +
            list.length +
            ' 项</span><span class="cat-line"></span></div><div class="card-grid">';
          list.forEach(function (g, i) {
            var done = lsGet('guide-done-' + g.id) === '1';
            var stepCount = g.steps.length;
            html +=
              '<div class="guide-card" data-id="' +
              g.id +
              '" style="animation-delay:' +
              Math.min(i * 40, 400) +
              'ms" onclick="showGuide(\'' +
              g.id +
              '\')">' +
              '<div class="gc-bar" style="background:linear-gradient(90deg,' +
              g.color +
              ',transparent)"></div>' +
              '<div class="gc-head"><div class="gc-icon" style="background:' +
              g.color +
              '22">' +
              g.icon +
              '</div>' +
              '<div class="gc-info"><div class="gc-title">' +
              escHtml(g.title) +
              '</div><div class="gc-title-en">' +
              escHtml(g.titleEn) +
              '</div>' +
              '<div class="gc-meta"><span class="gc-tag ' +
              g.diff +
              '">' +
              diffLabel(g.diff) +
              '</span><span class="gc-time">⏱ ' +
              g.time +
              '</span><span class="gc-time">▶ ' +
              stepCount +
              ' 步</span></div></div></div>' +
              '<div class="gc-desc">' +
              escHtml(g.desc) +
              '</div>' +
              '<div class="gc-tags"><span>' +
              escHtml(g.repo) +
              '</span>' +
              (g.site ? '<span>🔗 ' + escHtml(g.site) + '</span>' : '') +
              '</div>' +
              '<div class="gc-check' +
              (done ? ' done' : '') +
              '" onclick="event.stopPropagation(); toggleDone(\'' +
              g.id +
              '\')" title="标记完成"></div>' +
              '</div>';
          });
          html += '</div></div>';
        });
        document.getElementById('dashboardContent').innerHTML =
          html || '<div class="empty-state"><div class="es-icon">🔍</div><p>没有匹配的仓库</p></div>';
        document.getElementById('guideCount').textContent =
          '仓库矩阵 · ' + GUIDES.length + ' 项收录 / ' + TOTAL_REPOS + ' 仓库';
      }

      /* ═══ 过滤：分类 × 搜索词 ═══ */
      function applyFilters(q) {
        searchQuery = q || '';
        var anyVisible = false;
        document.querySelectorAll('#dashboardContent .guide-card').forEach(function (card) {
          var g = GUIDES.find(function (x) {
            return x.id === card.getAttribute('data-id');
          });
          var show = (currentFilter === 'all' || g.cat === currentFilter) && guideMatches(g, searchQuery);
          card.classList.toggle('hidden', !show);
          if (show) anyVisible = true;
        });
        document.querySelectorAll('#dashboardContent .cat-section').forEach(function (sec) {
          var visible = sec.querySelectorAll('.guide-card:not(.hidden)').length;
          sec.style.display = visible ? '' : 'none';
        });
        var empty = document.getElementById('dashboardContent').querySelector('.empty-state');
        if (!anyVisible && !empty) {
          document.getElementById('dashboardContent').innerHTML =
            '<div class="empty-state"><div class="es-icon">🔍</div><p>没有匹配的仓库</p></div>';
        } else if (anyVisible && empty) {
          empty.remove();
        }
      }

      /* ═══ 完成 / 进度追踪 ═══ */
      function toggleDone(id) {
        var done = lsGet('guide-done-' + id) === '1';
        lsSet('guide-done-' + id, done ? '0' : '1');
        var card = document.querySelector('.guide-card[data-id="' + id + '"] .gc-check');
        if (card) card.classList.toggle('done', !done);
        updateSidebarDots();
        updateSidebarProgress();
        renderStats();
      }
      function updateSidebarDots() {
        GUIDES.forEach(function (g) {
          var item = document.querySelector('#sbNav .sb-item[data-id="' + g.id + '"] .sb-dot');
          if (item) item.classList.toggle('done', lsGet('guide-done-' + g.id) === '1');
        });
      }
      function updateSidebarProgress() {
        var done = GUIDES.filter(function (g) {
          return lsGet('guide-done-' + g.id) === '1';
        }).length;
        var pct = GUIDES.length ? Math.round((done / GUIDES.length) * 100) : 0;
        document.getElementById('sbProgressPct').textContent = pct + '%';
        document.getElementById('sbProgressFill').style.width = pct + '%';
        document.getElementById('sbProgressCount').textContent = done + ' / ' + GUIDES.length + ' 已完成';
      }

      /* ═══ 指南详情 + Hash 路由 #guide-{id} ═══ */
      function showGuide(id, stepN) {
        var g = GUIDES.find(function (x) {
          return x.id === id;
        });
        if (!g) return;
        currentGuide = g;
        document.getElementById('dashboardView').style.display = 'none';
        var detail = document.getElementById('guideDetail');
        detail.classList.add('active');
        document.getElementById('topbarTitle').textContent = g.title;
        document.getElementById('topbarSubtitle').textContent = g.titleEn;
        document.querySelectorAll('#sbNav .sb-item').forEach(function (el) {
          el.classList.toggle('active', el.getAttribute('data-id') === id);
        });
        var doneCount = g.steps.filter(function (s) {
          return lsGet('step-done-' + g.id + '-' + s.n) === '1';
        }).length;
        var pct = Math.round((doneCount / g.steps.length) * 100);
        var html =
          '<button class="gd-back" onclick="showDashboard()">← 返回操作中心</button>' +
          '<div class="gd-hero"><div class="gd-hero-top"><div class="gd-hero-icon" style="background:' +
          g.color +
          '22">' +
          g.icon +
          '</div><div>' +
          '<div class="gd-hero-title">' +
          escHtml(g.title) +
          '</div><div class="gd-hero-titleEn">' +
          escHtml(g.titleEn) +
          '</div>' +
          '<div class="gd-hero-desc">' +
          escHtml(g.desc) +
          '</div></div></div>' +
          '<div class="gd-hero-meta"><span>📂 ' +
          escHtml((CATEGORY_META[g.cat] || {}).label || g.cat) +
          '</span><span>' +
          diffLabel(g.diff) +
          '</span><span>⏱ ' +
          g.time +
          '</span>' +
          '<span>📦 ' +
          escHtml(g.repo) +
          '</span>' +
          (g.site
            ? '<span>🔗 <a href="https://' +
              escHtml(g.site) +
              '" target="_blank" rel="noopener">' +
              escHtml(g.site) +
              '</a></span>'
            : '') +
          '<span>🔗 <a href="https://github.com/' +
          escHtml(g.repo) +
          '" target="_blank" rel="noopener">GitHub</a></span></div></div>' +
          '<div class="gd-progress active"><span class="gd-progress-text">📊 进度</span><div class="gd-progress-bar"><div class="gd-progress-fill" style="width:' +
          pct +
          '%"></div></div><span class="gd-progress-text">' +
          doneCount +
          '/' +
          g.steps.length +
          ' 步 (' +
          pct +
          '%)</span></div>' +
          '<div class="gd-prereq"><div class="gd-prereq-title">📋 操作步骤 · 点击编号标记完成 / 点击标题折叠</div><ul>';
        g.steps.forEach(function (s) {
          var open = lsGet('step-open-' + g.id + '-' + s.n) !== '0';
          var done = lsGet('step-done-' + g.id + '-' + s.n) === '1';
          html +=
            '<div class="step' +
            (open ? ' open' : '') +
            '" data-n="' +
            s.n +
            '">' +
            '<div class="step-head" onclick="toggleStep(\'' +
            g.id +
            "'," +
            s.n +
            ')">' +
            '<div class="step-num' +
            (done ? ' done' : '') +
            '" onclick="event.stopPropagation(); toggleStepDone(\'' +
            g.id +
            "'," +
            s.n +
            ')">' +
            s.n +
            '</div>' +
            '<div class="step-info"><div class="step-title">' +
            escHtml(s.title) +
            '</div>' +
            (s.time ? '<div class="step-time">⏱ ' + s.time + '</div>' : '') +
            '</div>' +
            '<span class="step-arrow">▶</span></div><div class="step-body"><p>' +
            escHtml(s.content) +
            '</p>';
          (s.code || []).forEach(function (c) {
            html +=
              '<div class="code-block"><div class="code-hdr"><span>' +
              escHtml(c[0]) +
              '</span><button class="copy-btn" onclick="copyCode(this, this.closest(\'.code-block\').querySelector(\'pre\').textContent)">📋 复制</button></div><pre>' +
              escHtml(c[1]) +
              '</pre></div>';
          });
          if (s.warning) html += '<div class="step-warning">⚠️ ' + escHtml(s.warning) + '</div>';
          if (s.tip) html += '<div class="step-tip">💡 ' + escHtml(s.tip) + '</div>';
          html += '</div></div>';
        });
        html += '</div>';
        detail.innerHTML = html;
        if (stepN) {
          var el = detail.querySelector('.step[data-n="' + stepN + '"]');
          if (el) {
            el.classList.add('open');
            el.scrollIntoView({ behavior: 'smooth', block: 'start' });
          }
        }
        if (location.hash !== '#guide-' + id) history.pushState(null, '', '#guide-' + id);
        window.scrollTo(0, 0);
      }

      /* ═══ 步骤折叠 / 步骤完成 ═══ */
      function toggleStep(id, n) {
        var el = document.querySelector('#guideDetail .step[data-n="' + n + '"]');
        var open = !el.classList.contains('open');
        el.classList.toggle('open', open);
        lsSet('step-open-' + id + '-' + n, open ? '1' : '0');
      }
      function toggleStepDone(id, n) {
        var done = lsGet('step-done-' + id + '-' + n) === '1';
        lsSet('step-done-' + id + '-' + n, done ? '0' : '1');
        var num = document.querySelector('#guideDetail .step[data-n="' + n + '"] .step-num');
        if (num) num.classList.toggle('done', !done);
        var g = GUIDES.find(function (x) {
          return x.id === id;
        });
        var doneCount = g.steps.filter(function (s) {
          return lsGet('step-done-' + id + '-' + s.n) === '1';
        }).length;
        var pct = Math.round((doneCount / g.steps.length) * 100);
        var bar = document.querySelector('#guideDetail .gd-progress-fill');
        var txt = document.querySelectorAll('#guideDetail .gd-progress-text')[1];
        if (bar) bar.style.width = pct + '%';
        if (txt) txt.textContent = doneCount + '/' + g.steps.length + ' 步 (' + pct + '%)';
        if (doneCount === g.steps.length && !done) toggleDone(id);
      }

      /* ═══ 步骤预览弹窗 ═══ */
      function openPreviewModal(id) {
        var g = GUIDES.find(function (x) {
          return x.id === id;
        });
        if (!g) return;
        document.getElementById('previewModalTitle').textContent = g.title + ' · 全部 ' + g.steps.length + ' 步';
        document.getElementById('previewModalBody').innerHTML =
          '<ol>' +
          g.steps
            .map(function (s) {
              return (
                '<li><strong>' + escHtml(s.title) + '</strong>' + (s.time ? ' <em>(' + s.time + ')</em>' : '') + '</li>'
              );
            })
            .join('') +
          '</ol>';
        document.getElementById('previewModal').classList.add('active');
      }
      function closePreviewModal() {
        document.getElementById('previewModal').classList.remove('active');
      }

      /* ═══ 进度导出 / 导入 / 重置 ═══ */
      function exportProgress() {
        var data = { app: 'YYC3-Cube-Hub', exportedAt: new Date().toISOString(), progress: {} };
        GUIDES.forEach(function (g) {
          var rec = {};
          if (lsGet('guide-done-' + g.id) === '1') rec.done = 1;
          g.steps.forEach(function (s) {
            if (lsGet('step-done-' + g.id + '-' + s.n) === '1') (rec.steps = rec.steps || []).push(s.n);
          });
          if (rec.done || rec.steps) data.progress[g.id] = rec;
        });
        var blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
        var a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = 'yc3hub-progress-' + new Date().toISOString().slice(0, 10) + '.json';
        a.click();
        URL.revokeObjectURL(a.href);
      }
      function importProgress() {
        var input = document.createElement('input');
        input.type = 'file';
        input.accept = 'application/json';
        input.onchange = function () {
          var reader = new FileReader();
          reader.onload = function () {
            try {
              var data = JSON.parse(reader.result);
              Object.keys(data.progress || {}).forEach(function (id) {
                var rec = data.progress[id];
                lsSet('guide-done-' + id, rec.done ? '1' : '0');
                (rec.steps || []).forEach(function (n) {
                  lsSet('step-done-' + id + '-' + n, '1');
                });
              });
              refreshAll();
              alert('进度导入成功');
            } catch (e) {
              alert('导入失败：无效的 JSON 文件');
            }
          };
          reader.readAsText(input.files[0]);
        };
        input.click();
      }
      function resetProgress() {
        if (!confirm('确定要重置全部进度吗？此操作不可恢复。')) return;
        var keys = [];
        for (var i = 0; i < localStorage.length; i++) {
          var k = localStorage.key(i);
          if (k && k.indexOf('yc3hub-') === 0 && k !== 'yc3hub-theme') keys.push(k);
        }
        keys.forEach(function (k) {
          localStorage.removeItem(k);
        });
        refreshAll();
      }

      /* ═══ 代码复制 ═══ */
      function copyCode(btn, code) {
        navigator.clipboard.writeText(code).then(function () {
          btn.textContent = '✅ 已复制';
          setTimeout(function () {
            btn.textContent = '📋 复制';
          }, 2000);
        });
      }

      /* ═══ 工具函数 ═══ */
      function escHtml(s) {
        return String(s).replace(/[&<>"']/g, function (c) {
          return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
        });
      }
      function parseGuideHash(hash) {
        var m = /^#guide-([\w-]+)(?:-step-(\d+))?$/.exec(hash || '');
        return m ? { id: m[1], step: m[2] ? parseInt(m[2], 10) : null } : null;
      }
      function refreshAll() {
        renderStats();
        renderDashboard();
        buildSidebar();
        updateSidebarDots();
        updateSidebarProgress();
      }

      /* ═══ 初始化 ═══ */
      function init() {
        updateThemeIcon();
        buildSidebar();
        renderStats();
        renderFilterBar();
        renderDashboard();
        updateSidebarDots();
        updateSidebarProgress();
        updateClock();
        setInterval(updateClock, 1000);
        var h = parseGuideHash(location.hash);
        if (
          h &&
          GUIDES.some(function (g) {
            return g.id === h.id;
          })
        )
          showGuide(h.id, h.step);
        window.addEventListener('hashchange', function () {
          var p = parseGuideHash(location.hash);
          if (
            p &&
            GUIDES.some(function (g) {
              return g.id === p.id;
            })
          )
            showGuide(p.id, p.step);
          else if (!location.hash) showDashboard();
        });
      }
      init();
    </script>
  </body>
</html>
