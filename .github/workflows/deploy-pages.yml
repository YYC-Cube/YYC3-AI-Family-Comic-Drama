name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "public/**"
      - "index.html"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

# 单通道定稿：远程 Pages build_type=workflow，仅本 workflow 部署，不启用分支自动部署
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Assemble site
        run: |
          mkdir -p _site
          # public 目录为站点根（含 CNAME / yyc3-icons / yyc3-family.png）
          cp -r public/. _site/
          # 根门户页
          cp index.html _site/index.html
          # 404 回退到首页（SPA 风格兜底）
          cp index.html _site/404.html
          echo "站点文件清单："
          find _site -maxdepth 2 -type f | sort

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
